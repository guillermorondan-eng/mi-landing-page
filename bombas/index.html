<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Bombas Hidráulicas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2128;
  --border:rgba(99,110,123,0.3); --border2:rgba(99,110,123,0.5);
  --text:#e6edf3; --text2:#8b949e; --text3:#6e7681;
  --accent:#1f6feb; --accent2:#388bfd;
  --green:#3fb950; --yellow:#d29922; --red:#f85149;
  --font:'JetBrains Mono','Courier New',monospace;
  --font2:'Segoe UI',system-ui,sans-serif;
}
body { background:var(--bg); color:var(--text); font-family:var(--font2); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
header { background:var(--bg2); border-bottom:1px solid var(--border); padding:.6rem 1.25rem; display:flex; align-items:center; gap:.75rem; flex-shrink:0; }
.logo { width:28px;height:28px;background:var(--accent);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:14px;color:white; }
header h1 { font-size:14px;font-weight:600;color:var(--text); }
header span { font-size:10px;color:var(--text3);font-family:var(--font);background:var(--bg3);padding:2px 6px;border-radius:3px;border:1px solid var(--border); }
.main { display:grid; grid-template-columns:260px 1fr 1fr; flex:1; overflow:hidden; border-bottom:1px solid var(--border); }
.col { display:flex; flex-direction:column; overflow:hidden; }
.col-left { background:var(--bg2); border-right:1px solid var(--border); overflow-y:auto; padding:1rem; gap:1rem; display:flex; flex-direction:column; }
.col-mid { border-right:1px solid var(--border); padding:.75rem; display:flex; flex-direction:column; }
.col-right { padding:.75rem; display:flex; flex-direction:column; }
.bottom { background:var(--bg); padding:.75rem 1rem; flex-shrink:0; border-top:1px solid var(--border); }
.section-title { font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);font-family:var(--font);margin-bottom:.5rem;display:flex;align-items:center;gap:4px; }
.field { display:flex;flex-direction:column;gap:3px;margin-bottom:.5rem; }
label { font-size:10px;color:var(--text2);font-family:var(--font); }
.input-row { display:flex;align-items:center;background:var(--bg3);border:1px solid var(--border);border-radius:4px;overflow:hidden;transition:border-color .2s; }
.input-row:focus-within { border-color:var(--accent); }
input[type="number"] { background:transparent;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:11px;padding:6px 8px;flex:1;width:100%; }
.unit { font-size:9px;color:var(--text3);font-family:var(--font);padding:0 7px;border-left:1px solid var(--border);white-space:nowrap; }
.divider { height:1px;background:var(--border);margin:.5rem 0; }
.table-header { display:grid;grid-template-columns:1fr 1fr 1fr 1fr 24px;gap:3px;margin-bottom:3px; }
.table-header span { font-size:9px;color:var(--text3);font-family:var(--font);text-align:center;padding:2px;background:var(--bg3);border-radius:2px; }
.table-row { display:grid;grid-template-columns:1fr 1fr 1fr 1fr 24px;gap:3px;align-items:center;margin-bottom:3px; }
.table-row input { background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:var(--font);font-size:10px;padding:4px 5px;text-align:center;outline:none; }
.table-row input:focus { border-color:var(--accent); }
.hinst-cell { background:var(--bg3);border:1px solid rgba(63,185,80,0.3);border-radius:3px;color:#3fb950;font-family:var(--font);font-size:10px;padding:4px 5px;text-align:center; }
.btn-remove { background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--text3);cursor:pointer;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px; }
.btn-remove:hover { border-color:var(--red);color:var(--red); }
.btn-add { background:transparent;border:1px dashed var(--border);border-radius:4px;color:var(--text3);cursor:pointer;padding:5px;font-size:10px;font-family:var(--font2);display:flex;align-items:center;justify-content:center;gap:4px;margin-top:3px; }
.btn-add:hover { border-color:var(--accent2);color:var(--accent2); }
.btn-calc { background:var(--accent);border:none;border-radius:6px;color:white;cursor:pointer;padding:10px;font-size:12px;font-weight:600;font-family:var(--font2);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;margin-top:auto; }
.btn-calc:hover { background:var(--accent2); }
.col-title { font-size:10px;font-weight:600;color:var(--text3);font-family:var(--font);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.5rem;display:flex;align-items:center;gap:4px;flex-shrink:0; }
.col-title i { font-size:12px;color:var(--accent2); }
.croquis-area { flex:1;min-height:0;display:flex;align-items:center;justify-content:center; }
.croquis-area svg { width:100%;height:100%; }
.chart-area { flex:1;min-height:0;position:relative; }
.kpi-grid { display:grid;grid-template-columns:repeat(5,1fr);gap:6px; }
.kpi-card { background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:.5rem .75rem; }
.kpi-label { font-size:8px;color:var(--text3);font-family:var(--font);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px; }
.kpi-value { font-size:16px;font-weight:700;font-family:var(--font);line-height:1; }
.kpi-unit { font-size:9px;color:var(--text2);font-weight:400; }
.kpi-sub { font-size:8px;color:var(--text3);font-family:var(--font);margin-top:2px; }
.kpi-card.ac { border-color:var(--accent); }
.kpi-card.ac .kpi-value { color:var(--accent2); }
.kpi-card.gr { border-color:rgba(63,185,80,.4); }
.kpi-card.gr .kpi-value { color:var(--green); }
.kpi-card.ye { border-color:rgba(210,153,34,.4); }
.kpi-card.ye .kpi-value { color:var(--yellow); }
.kpi-card.re { border-color:rgba(248,81,73,.3); }
.kpi-card.re .kpi-value { color:var(--red); }
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-thumb { background:var(--border2);border-radius:2px; }
</style>
</head>
<body>

<header>
  <div class="logo"><i class="ti ti-ripple"></i></div>
  <h1>Calculadora Hidráulica — Bombas Centrífugas</h1>
  <span>v1.0</span>
</header>

<div class="main">

  <div class="col col-left">
    <div>
      <div class="section-title"><i class="ti ti-building-factory"></i> Instalación</div>
      <div class="field">
        <label>Altura geométrica (Hg)</label>
        <div class="input-row"><input type="number" id="hg" value="20" step="0.1" min="0"><span class="unit">m</span></div>
      </div>
      <div class="field">
        <label>Pérdida de carga</label>
        <div class="input-row"><input type="number" id="perdida" value="15" step="0.1" min="0"><span class="unit">m</span></div>
      </div>
      <div class="field">
        <label>Caudal de diseño (Q)</label>
        <div class="input-row"><input type="number" id="q_req" value="46" step="1" min="0"><span class="unit">m³/h</span></div>
      </div>
      <div class="field">
        <label>RPM referencia (catálogo)</label>
        <div class="input-row"><input type="number" id="rpm_ref" value="1150" step="50" min="100"><span class="unit">rpm</span></div>
      </div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-title"><i class="ti ti-table"></i> Curva de la bomba</div>
      <div class="table-header">
        <span>Q (m³/h)</span><span>H (m)</span><span>η (%)</span><span style="color:#3fb950">H inst</span><span></span>
      </div>
      <div id="tabla-bomba"></div>
      <button class="btn-add" onclick="agregarFila()">
        <i class="ti ti-plus" aria-hidden="true"></i> Agregar punto
      </button>
    </div>
    <button class="btn-calc" onclick="calcular()">
      <i class="ti ti-bolt" aria-hidden="true"></i> Calcular
    </button>
  </div>

  <div class="col col-mid">
    <div class="col-title"><i class="ti ti-topology-star"></i> Esquema de la instalación</div>
    <div class="croquis-area" id="croquis-area"></div>
  </div>

  <div class="col col-right">
    <div class="col-title"><i class="ti ti-chart-line"></i> Curvas Q-H</div>
    <div class="chart-area">
      <canvas id="chartH"></canvas>
    </div>
  </div>

</div>

<div class="bottom" id="bottom">
  <div style="display:flex;align-items:center;justify-content:center;height:50px;color:var(--text3);font-size:11px;font-family:var(--font);">
    Ingresá los datos y presioná Calcular
  </div>
</div>

<script>
// Datos ejercicio 26 — Q en m³/h
const datosIniciales = [
  {q:22.7,  h:29.6, e:40},
  {q:45.4,  h:28.7, e:62},
  {q:68.1,  h:26.2, e:78},
  {q:90.8,  h:22.9, e:84},
  {q:113.6, h:19.5, e:77},
  {q:136.3, h:14.3, e:62},
  {q:159.0, h:9.1,  e:40},
];

function agregarFila(q='',h='',e='') {
  const cont = document.getElementById('tabla-bomba');
  const div = document.createElement('div');
  div.className = 'table-row';
  div.innerHTML = `
    <input type="number" value="${q}" step="0.1" placeholder="0.0" oninput="actualizarGrafica()">
    <input type="number" value="${h}" step="0.1" placeholder="0.0" oninput="actualizarGrafica()">
    <input type="number" value="${e}" step="1" placeholder="0">
    <span class="hinst-cell">—</span>
    <button class="btn-remove" onclick="this.parentElement.remove();actualizarGrafica()" aria-label="Eliminar">
      <i class="ti ti-x" aria-hidden="true"></i>
    </button>`;
  cont.appendChild(div);
}

datosIniciales.forEach(d => agregarFila(d.q, d.h, d.e));

function obtenerDatos() {
  const filas = document.querySelectorAll('#tabla-bomba .table-row');
  const puntos = [];
  filas.forEach(f => {
    const inputs = f.querySelectorAll('input');
    const q = parseFloat(inputs[0].value), h = parseFloat(inputs[1].value), e = parseFloat(inputs[2].value);
    if (!isNaN(q) && !isNaN(h)) puntos.push({q, h, e: isNaN(e) ? 0 : e});
  });
  return puntos.sort((a,b) => a.q - b.q);
}

function interpolar(pts, q) {
  if (!pts.length) return 0;
  if (q <= pts[0].q) return pts[0].h;
  if (q >= pts[pts.length-1].q) return pts[pts.length-1].h;
  for (let i = 0; i < pts.length-1; i++) {
    if (q >= pts[i].q && q <= pts[i+1].q) {
      const t = (q-pts[i].q)/(pts[i+1].q-pts[i].q);
      return pts[i].h + t*(pts[i+1].h-pts[i].h);
    }
  }
}

function interpolarEta(pts, q) {
  if (!pts.length) return 0;
  if (q <= pts[0].q) return pts[0].e;
  if (q >= pts[pts.length-1].q) return pts[pts.length-1].e;
  for (let i = 0; i < pts.length-1; i++) {
    if (q >= pts[i].q && q <= pts[i+1].q) {
      const t = (q-pts[i].q)/(pts[i+1].q-pts[i].q);
      return pts[i].e + t*(pts[i+1].e-pts[i].e);
    }
  }
}

function findIntersection(pts, hg, perdida, qReq) {
  const qMax = pts[pts.length-1].q * 1.3;
  let bestQ = 0, bestDiff = Infinity;
  for (let i = 0; i <= 3000; i++) {
    const q = (i/3000)*qMax;
    const diff = Math.abs(interpolar(pts,q) - (hg + perdida*Math.pow(q/qReq,2)));
    if (diff < bestDiff) { bestDiff = diff; bestQ = q; }
  }
  return bestQ;
}

function dibujarCroquis(hg, perdida, qOp, hOp, calculado) {
  const W = 400, H = 260;
  const escala = Math.min(140 / Math.max(hg, 1), 16);
  const alturaPx = Math.min(hg * escala, 140);
  const tW = 55, tH = 45;
  const tiX = 30, tiY = 200;
  const tsX = 290, tsY = tiY - alturaPx;
  const bX = 170, bY = tiY - 8;
  const stroke = calculado ? Math.min(Math.max(qOp / 30, 2), 6).toFixed(1) : '3';
  const hTotal = (hg + perdida).toFixed(1);
  const qLabel = calculado ? `Q=${qOp.toFixed(1)} m³/h` : 'Q = ?';
  const hmLabel = calculado ? `Hm=${hTotal} m` : `Hg=${hg.toFixed(1)} m`;
  const z1Y = tiY - 15;
  const z2Y = tsY - 15;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;font-family:'JetBrains Mono',monospace;">
  <defs>
    <marker id="ma" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3z" fill="#388bfd"/></marker>
    <marker id="mg" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3z" fill="#3fb950"/></marker>
    <marker id="my" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3z" fill="#d29922"/></marker>
    <marker id="myr" markerWidth="6" markerHeight="6" refX="2" refY="3" orient="auto-start-reverse"><path d="M0,3 L6,0 L6,6z" fill="#d29922"/></marker>
  </defs>
  <line x1="10" y1="${tiY+10}" x2="${W-10}" y2="${tiY+10}" stroke="#6e7681" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="12" y="${tiY+22}" fill="#6e7681" font-size="7">z = 0</text>
  <line x1="${tiX-10}" y1="${tiY+10}" x2="${tiX-10}" y2="${z1Y}" stroke="#388bfd" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="${tiX-15}" y1="${z1Y}" x2="${tiX-5}" y2="${z1Y}" stroke="#388bfd" stroke-width="1.2"/>
  <text x="${tiX-22}" y="${(tiY+10+z1Y)/2+3}" fill="#388bfd" font-size="9" font-style="italic">z₁</text>
  <line x1="${tsX+tW+10}" y1="${tiY+10}" x2="${tsX+tW+10}" y2="${z2Y}" stroke="#3fb950" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="${tsX+tW+5}" y1="${z2Y}" x2="${tsX+tW+15}" y2="${z2Y}" stroke="#3fb950" stroke-width="1.2"/>
  <text x="${tsX+tW+18}" y="${z2Y+3}" fill="#3fb950" font-size="9" font-style="italic">z₂</text>
  <line x1="${tsX+tW+28}" y1="${z1Y}" x2="${tsX+tW+28}" y2="${z2Y}" stroke="#d29922" stroke-width="1.5" marker-start="url(#myr)" marker-end="url(#my)"/>
  <text x="${tsX+tW+34}" y="${(z1Y+z2Y)/2+3}" fill="#d29922" font-size="8">Hg=${hg.toFixed(1)}m</text>
  <rect x="${tiX}" y="${tiY-tH}" width="${tW}" height="${tH}" fill="rgba(56,139,253,0.07)" stroke="#388bfd" stroke-width="1.5" rx="3"/>
  <rect x="${tiX+3}" y="${tiY-tH+8}" width="${tW-6}" height="11" fill="rgba(56,139,253,0.2)" rx="2"/>
  <text x="${tiX+tW/2}" y="${tiY+18}" text-anchor="middle" fill="#6e7681" font-size="8">Tanque inf.</text>
  <text x="${tiX+tW/2}" y="${tiY-tH/2+4}" text-anchor="middle" fill="#388bfd" font-size="11">≈</text>
  <rect x="${tsX}" y="${tsY-tH}" width="${tW}" height="${tH}" fill="rgba(63,185,80,0.07)" stroke="#3fb950" stroke-width="1.5" rx="3"/>
  <rect x="${tsX+3}" y="${tsY-tH+8}" width="${tW-6}" height="11" fill="rgba(63,185,80,0.2)" rx="2"/>
  <text x="${tsX+tW/2}" y="${tsY+18}" text-anchor="middle" fill="#6e7681" font-size="8">Tanque sup.</text>
  <text x="${tsX+tW/2}" y="${tsY-tH/2+4}" text-anchor="middle" fill="#3fb950" font-size="11">≈</text>
  <circle cx="${bX}" cy="${bY-18}" r="18" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
  <polygon points="${bX-7},${bY-18} ${bX+4},${bY-26} ${bX+4},${bY-10}" fill="#388bfd"/>
  <text x="${bX}" y="${bY+6}" text-anchor="middle" fill="#6e7681" font-size="8">B</text>
  <polyline points="${tiX+tW},${tiY} ${bX-18},${tiY} ${bX-18},${bY-18}" fill="none" stroke="#388bfd" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ma)"/>
  <text x="${(tiX+tW+bX)/2}" y="${tiY-4}" text-anchor="middle" fill="#388bfd" font-size="7">succión</text>
  <text x="${(tiX+tW+bX)/2}" y="${tiY+10}" text-anchor="middle" fill="#388bfd" font-size="8" font-weight="700">${qLabel}</text>
  <polyline points="${bX+18},${bY-18} ${bX+18},${tsY-16} ${tsX},${tsY-16}" fill="none" stroke="#3fb950" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mg)"/>
  <text x="${bX+28}" y="${(bY+tsY)/2-10}" fill="#3fb950" font-size="7">impulsión</text>
  <text x="${bX+28}" y="${bY-50}" fill="${calculado ? '#d29922' : '#6e7681'}" font-size="8">${hmLabel}</text>
  ${calculado ? `<text x="${bX+28}" y="${bY-40}" fill="#f85149" font-size="8">ΔH=${perdida.toFixed(1)}m</text>` : ''}
</svg>`;
}

let chartH = null;
let calculadoFlag = false;

function actualizarGrafica(datosCalc) {
  const puntos = obtenerDatos();
  if (puntos.length < 2) return;

  const datasets = [{
    label: 'Curva bomba N1 (catálogo)',
    data: puntos.map(p => ({x: p.q, y: p.h})),
    borderColor: '#388bfd',
    backgroundColor: 'rgba(56,139,253,0.06)',
    tension: 0.4, fill: false, pointRadius: 4,
    pointBackgroundColor: '#388bfd', borderWidth: 2
  }];

  if (calculadoFlag && datosCalc) {
    const { hg, perdida, qReq, qP, hP, rpmNecesaria, rpmRef, qR, hR } = datosCalc;
    const qMax = Math.max(puntos[puntos.length-1].q, qReq) * 1.1;

    // Curva instalación
    const instPts = [];
    for (let i = 0; i <= 30; i++) {
      const q = (i/30) * qMax;
      instPts.push({x: parseFloat(q.toFixed(2)), y: parseFloat((hg + perdida*Math.pow(q/qReq,2)).toFixed(2))});
    }
    datasets.push({
      label: 'Curva instalación',
      data: instPts,
      borderColor: '#3fb950', tension: 0.4, fill: false,
      pointRadius: 0, borderWidth: 2, borderDash: [5,4]
    });

    // Parábola de homología H = K·Q²
    const K = hR / (qR * qR);
    const parabPts = [];
    for (let i = 0; i <= 30; i++) {
      const q = (i/30) * qMax;
      parabPts.push({x: parseFloat(q.toFixed(2)), y: parseFloat((K*q*q).toFixed(2))});
    }
    datasets.push({
      label: 'Parábola de homología',
      data: parabPts,
      borderColor: '#f85149', tension: 0.4, fill: false,
      pointRadius: 0, borderWidth: 1.5, borderDash: [3,3]
    });

    // Curva de la bomba a N2 (escalada)
    const ratio = rpmNecesaria / rpmRef;
    const curvaN2 = puntos.map(p => ({
      x: parseFloat((p.q * ratio).toFixed(2)),
      y: parseFloat((p.h * ratio * ratio).toFixed(2))
    }));
    // Extender hasta qR
    datasets.push({
      label: ,
      data: curvaN2,
      borderColor: '#d29922', tension: 0.4, fill: false,
      pointRadius: 3, pointBackgroundColor: '#d29922', borderWidth: 2
    });

    // Punto P (homólogo en curva original)
    datasets.push({
      label: 'Punto P (homólogo)',
      data: [{x: parseFloat(qP.toFixed(2)), y: parseFloat(hP.toFixed(2))}],
      borderColor: '#388bfd', backgroundColor: '#161b22',
      pointRadius: 8, pointStyle: 'circle', showLine: false,
      borderWidth: 2
    });

    // Punto R (requerido)
    datasets.push({
      label: ,
      data: [{x: parseFloat(qR.toFixed(2)), y: parseFloat(hR.toFixed(2))}],
      borderColor: '#3fb950', backgroundColor: '#3fb950',
      pointRadius: 9, showLine: false
    });
  }

  if (chartH) {
    chartH.data.datasets = datasets;
    chartH.update();
  } else {
    const ctx = document.getElementById('chartH').getContext('2d');
    chartH = new Chart(ctx, {
      type: 'line',
      data: { datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color:'#8b949e', font:{family:'JetBrains Mono,monospace',size:9} } },
          tooltip: { backgroundColor:'#161b22', borderColor:'#30363d', borderWidth:1, titleColor:'#e6edf3', bodyColor:'#8b949e' }
        },
        scales: {
          x: { type:'linear', title:{display:true,text:'Q (m³/h)',color:'#8b949e'}, ticks:{color:'#6e7681'}, grid:{color:'rgba(99,110,123,.1)'} },
          y: { title:{display:true,text:'H (m)',color:'#8b949e'}, ticks:{color:'#6e7681'}, grid:{color:'rgba(99,110,123,.1)'} }
        }
      }
    });
  }
}

function actualizarCroquis(hg, perdida, qOp, hOp, calculado) {
  document.getElementById('croquis-area').innerHTML = dibujarCroquis(hg, perdida, qOp||0, hOp||0, calculado);
}

function calcular() {
  const puntos = obtenerDatos();
  if (puntos.length < 3) { alert('Ingresá al menos 3 puntos.'); return; }

  const hg = parseFloat(document.getElementById('hg').value);
  const perdida = parseFloat(document.getElementById('perdida').value);
  const qReq = parseFloat(document.getElementById('q_req').value);
  const rpmRef = parseFloat(document.getElementById('rpm_ref').value);
  if ([hg,perdida,qReq,rpmRef].some(isNaN)) { alert('Completá todos los campos.'); return; }

  const qOp = findIntersection(puntos, hg, perdida, qReq);
  const hOp = interpolar(puntos, qOp);
  const etaOp = interpolarEta(puntos, qOp);
  const hInsOp = hg + perdida * Math.pow(qOp/qReq, 2);
  const hReq = hg + perdida;
  // Punto homólogo P: intersección parábola H=K·Q² con curva de la bomba
  const K = hReq / (qReq * qReq);
  let qP = puntos[0].q, hP = interpolar(puntos, puntos[0].q);
  let bestDiffP = Math.abs(hP - K * qP * qP);
  for (let i = 1; i <= 5000; i++) {
    const q = (i/5000) * puntos[puntos.length-1].q;
    const hBomba = interpolar(puntos, q);
    const diff = Math.abs(hBomba - K * q * q);
    if (diff < bestDiffP) { bestDiffP = diff; qP = q; hP = hBomba; }
  }
  const rpmNecesaria = rpmRef * Math.sqrt(hReq / hP);
  const gamma = 9810;
  // Q en m³/h → convertir a m³/s para potencia
  const qMs = qOp / 3600;
  const potencia = (gamma * qMs * hOp) / (etaOp/100 || 1);
  const potenciaKW = potencia / 1000;
  const etaMax = Math.max(...puntos.map(p => p.e));

  calculadoFlag = true;
  actualizarCroquis(hg, perdida, qReq, hReq, true);
  actualizarGrafica({ hg, perdida, qReq, qP, hP, rpmNecesaria, rpmRef, qR: qReq, hR: hReq });

  // Rellenar columna H instalación en cada fila
  const filas = document.querySelectorAll('#tabla-bomba .table-row');
  filas.forEach(f => {
    const q = parseFloat(f.querySelectorAll('input')[0].value);
    if (!isNaN(q)) {
      const hInst = hg + perdida * Math.pow(q / qReq, 2);
      f.querySelector('.hinst-cell').textContent = hInst.toFixed(1);
    }
  });

  document.getElementById('bottom').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card ac">
        <div class="kpi-label">Caudal operativo</div>
        <div class="kpi-value">${qOp.toFixed(1)}<span class="kpi-unit"> m³/h</span></div>
        <div class="kpi-sub">${(qOp/3.6).toFixed(3)} m³/s</div>
      </div>
      <div class="kpi-card ac">
        <div class="kpi-label">Altura operativa (H bomba)</div>
        <div class="kpi-value">${hOp.toFixed(2)}<span class="kpi-unit"> m</span></div>
        <div class="kpi-sub">H inst: ${hInsOp.toFixed(2)} m</div>
      </div>
      <div class="kpi-card gr">
        <div class="kpi-label">Rendimiento</div>
        <div class="kpi-value">${etaOp.toFixed(1)}<span class="kpi-unit"> %</span></div>
        <div class="kpi-sub">η máx: ${etaMax.toFixed(1)}%</div>
      </div>
      <div class="kpi-card ye">
        <div class="kpi-label">Potencia consumida</div>
        <div class="kpi-value">${potenciaKW.toFixed(2)}<span class="kpi-unit"> kW</span></div>
        <div class="kpi-sub">${potencia.toFixed(0)} W</div>
      </div>
      <div class="kpi-card re">
        <div class="kpi-label">RPM requeridas</div>
        <div class="kpi-value">${rpmNecesaria.toFixed(0)}<span class="kpi-unit"> rpm</span></div>
        <div class="kpi-sub">ref: ${rpmRef.toFixed(0)} rpm</div>
      </div>
    </div>
  `;
}

const hg0 = parseFloat(document.getElementById('hg').value);
const p0 = parseFloat(document.getElementById('perdida').value);
actualizarCroquis(hg0, p0, 0, 0, false);
actualizarGrafica();

document.getElementById('hg').addEventListener('input', () => {
  actualizarCroquis(parseFloat(document.getElementById('hg').value)||0, parseFloat(document.getElementById('perdida').value)||0, 0, 0, false);
});
document.getElementById('perdida').addEventListener('input', () => {
  actualizarCroquis(parseFloat(document.getElementById('hg').value)||0, parseFloat(document.getElementById('perdida').value)||0, 0, 0, false);
});
</script>
