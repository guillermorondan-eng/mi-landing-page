<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Bombas Hidráulicas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #1c2128;
    --border: rgba(99,110,123,0.3); --border2: rgba(99,110,123,0.5);
    --text: #e6edf3; --text2: #8b949e; --text3: #6e7681;
    --accent: #1f6feb; --accent2: #388bfd;
    --green: #3fb950; --yellow: #d29922; --red: #f85149;
    --font: 'JetBrains Mono','Courier New',monospace;
    --font2: 'Segoe UI',system-ui,sans-serif;
  }
  body { background:var(--bg); color:var(--text); font-family:var(--font2); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { background:var(--bg2); border-bottom:1px solid var(--border); padding:.75rem 1.5rem; display:flex; align-items:center; gap:.75rem; flex-shrink:0; }
  .logo { width:32px;height:32px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;color:white; }
  header h1 { font-size:15px;font-weight:600;color:var(--text); }
  header span { font-size:11px;color:var(--text3);font-family:var(--font);background:var(--bg3);padding:2px 7px;border-radius:4px;border:1px solid var(--border); }
  .layout { display:grid; grid-template-columns:300px 1fr; flex:1; overflow:hidden; }
  .panel-left { background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:1.25rem;display:flex;flex-direction:column;gap:1.25rem; }
  .panel-right { display:grid; grid-template-rows:1fr 1fr; overflow:hidden; }
  .panel-top { border-bottom:1px solid var(--border); padding:1rem 1.25rem; overflow:hidden; display:flex; flex-direction:column; }
  .panel-bottom { padding:1rem 1.25rem; overflow-y:auto; display:flex; flex-direction:column; gap:1rem; }
  .section-title { font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);font-family:var(--font);margin-bottom:.6rem;display:flex;align-items:center;gap:5px; }
  .section-title i { font-size:12px; }
  .field-group { display:flex;flex-direction:column;gap:.6rem; }
  .field { display:flex;flex-direction:column;gap:3px; }
  label { font-size:11px;color:var(--text2);font-family:var(--font); }
  .input-row { display:flex;align-items:center;background:var(--bg3);border:1px solid var(--border);border-radius:5px;overflow:hidden;transition:border-color .2s; }
  .input-row:focus-within { border-color:var(--accent); }
  input[type="number"] { background:transparent;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:12px;padding:7px 9px;flex:1;width:100%; }
  .unit { font-size:10px;color:var(--text3);font-family:var(--font);padding:0 8px;border-left:1px solid var(--border);white-space:nowrap; }
  .divider { height:1px;background:var(--border); }
  .table-section { display:flex;flex-direction:column;gap:.4rem; }
  .table-header { display:grid;grid-template-columns:1fr 1fr 1fr 26px;gap:3px; }
  .table-header span { font-size:9px;color:var(--text3);font-family:var(--font);text-align:center;padding:3px;background:var(--bg3);border-radius:3px; }
  .table-row { display:grid;grid-template-columns:1fr 1fr 1fr 26px;gap:3px;align-items:center; }
  .table-row input { background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:var(--font);font-size:11px;padding:5px 6px;text-align:center;outline:none;transition:border-color .2s; }
  .table-row input:focus { border-color:var(--accent); }
  .btn-remove { background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--text3);cursor:pointer;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .2s; }
  .btn-remove:hover { border-color:var(--red);color:var(--red); }
  .btn-add { background:transparent;border:1px dashed var(--border);border-radius:5px;color:var(--text3);cursor:pointer;padding:6px;font-size:11px;font-family:var(--font2);display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s;margin-top:3px; }
  .btn-add:hover { border-color:var(--accent2);color:var(--accent2); }
  .btn-calc { background:var(--accent);border:none;border-radius:7px;color:white;cursor:pointer;padding:11px;font-size:12px;font-weight:600;font-family:var(--font2);display:flex;align-items:center;justify-content:center;gap:7px;transition:all .2s; }
  .btn-calc:hover { background:var(--accent2);transform:translateY(-1px); }
  .btn-calc i { font-size:15px; }
  .croquis-wrap { flex:1;display:flex;align-items:center;justify-content:center;min-height:0; }
  .croquis-wrap svg { width:100%;height:100%;max-height:100%; }
  .chart-title { font-size:10px;font-weight:600;color:var(--text2);font-family:var(--font);letter-spacing:.05em;text-transform:uppercase;margin-bottom:.75rem;display:flex;align-items:center;gap:5px;flex-shrink:0; }
  .chart-title i { font-size:13px;color:var(--accent2); }
  .kpi-grid { display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex-shrink:0; }
  .kpi-card { background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem; }
  .kpi-label { font-size:9px;color:var(--text3);font-family:var(--font);letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:4px;margin-bottom:4px; }
  .kpi-label i { font-size:11px; }
  .kpi-value { font-size:20px;font-weight:700;font-family:var(--font);color:var(--text);line-height:1; }
  .kpi-unit { font-size:11px;color:var(--text2);font-weight:400; }
  .kpi-sub { font-size:9px;color:var(--text3);font-family:var(--font);margin-top:3px; }
  .kpi-card.accent { border-color:var(--accent); }
  .kpi-card.accent .kpi-value { color:var(--accent2); }
  .kpi-card.green { border-color:rgba(63,185,80,.4); }
  .kpi-card.green .kpi-value { color:var(--green); }
  .kpi-card.yellow { border-color:rgba(210,153,34,.4); }
  .kpi-card.yellow .kpi-value { color:var(--yellow); }
  .charts-row { display:grid;grid-template-columns:1fr 1fr;gap:1rem;flex:1;min-height:0; }
  .chart-box { background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:1rem;display:flex;flex-direction:column;min-height:0; }
  .chart-box canvas { flex:1;min-height:0; }
  .result-row { display:grid;grid-template-columns:1fr 1fr;gap:1rem;flex-shrink:0; }
  .result-card { background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:1rem; }
  .result-title { font-size:10px;font-weight:600;color:var(--text2);font-family:var(--font);letter-spacing:.05em;text-transform:uppercase;margin-bottom:.75rem;display:flex;align-items:center;gap:5px; }
  .result-title i { font-size:12px;color:var(--green); }
  .result-table { width:100%;border-collapse:collapse; }
  .result-table td { padding:5px 0;font-size:11px;border-bottom:1px solid var(--border); }
  .result-table tr:last-child td { border-bottom:none; }
  .result-table td:first-child { color:var(--text2);font-family:var(--font);font-size:10px; }
  .result-table td:last-child { text-align:right;font-family:var(--font);font-weight:600;color:var(--text); }
  .rpm-highlight { background:linear-gradient(90deg,rgba(31,111,235,.1),transparent);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:.75rem;font-family:var(--font);font-size:11px;color:var(--text2); }
  .rpm-highlight strong { color:var(--accent2);font-size:16px;display:block;margin-top:3px; }
  .empty-croquis { display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:.5rem; }
  .empty-croquis i { font-size:40px;opacity:.2; }
  .empty-croquis p { font-size:11px;font-family:var(--font);opacity:.5; }
  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-thumb { background:var(--border2);border-radius:3px; }
</style>
</head>
<body>

<header>
  <div class="logo"><i class="ti ti-ripple"></i></div>
  <h1>Calculadora Hidráulica — Bombas Centrífugas</h1>
  <span>v1.0</span>
</header>

<div class="layout">
  <!-- PANEL IZQUIERDO -->
  <div class="panel-left">
    <div>
      <div class="section-title"><i class="ti ti-building-factory"></i> Datos de instalación</div>
      <div class="field-group">
        <div class="field">
          <label>Altura geométrica (Hg)</label>
          <div class="input-row">
            <input type="number" id="hg" value="10" step="0.1" min="0">
            <span class="unit">m</span>
          </div>
        </div>
        <div class="field">
          <label>Pérdida de carga</label>
          <div class="input-row">
            <input type="number" id="perdida" value="5" step="0.1" min="0">
            <span class="unit">m</span>
          </div>
        </div>
        <div class="field">
          <label>Caudal de diseño (Q)</label>
          <div class="input-row">
            <input type="number" id="q_req" value="0.1" step="0.01" min="0">
            <span class="unit">m³/s</span>
          </div>
        </div>
        <div class="field">
          <label>RPM de referencia (catálogo)</label>
          <div class="input-row">
            <input type="number" id="rpm_ref" value="1450" step="50" min="100">
            <span class="unit">rpm</span>
          </div>
        </div>
      </div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-title"><i class="ti ti-table"></i> Curva de la bomba</div>
      <div class="table-section">
        <div class="table-header">
          <span>Q (m³/s)</span><span>H (m)</span><span>η (%)</span><span></span>
        </div>
        <div id="tabla-bomba"></div>
        <button class="btn-add" onclick="agregarFila()">
          <i class="ti ti-plus" aria-hidden="true"></i> Agregar punto
        </button>
      </div>
    </div>
    <div class="divider"></div>
    <button class="btn-calc" onclick="calcular()">
      <i class="ti ti-bolt" aria-hidden="true"></i>
      Calcular punto de funcionamiento
    </button>
  </div>

  <!-- PANEL DERECHO -->
  <div class="panel-right">

    <!-- FILA SUPERIOR: CROQUIS -->
    <div class="panel-top">
      <div class="chart-title"><i class="ti ti-topology-star"></i> Esquema de la instalación</div>
      <div class="croquis-wrap" id="croquis-wrap">
        <div class="empty-croquis">
          <i class="ti ti-building-factory" aria-hidden="true"></i>
          <p>Ingresá los datos y calculá</p>
        </div>
      </div>
    </div>

    <!-- FILA INFERIOR: GRÁFICAS + KPIs + RESULTADOS -->
    <div class="panel-bottom" id="panel-bottom">
      <div class="empty-croquis" style="height:200px;">
        <i class="ti ti-chart-dots" aria-hidden="true"></i>
        <p>Los resultados aparecerán aquí</p>
      </div>
    </div>

  </div>
</div>

<script>
const datosIniciales = [
  {q:0,h:15.2,e:0},{q:0.05,h:15.0,e:35},{q:0.1,h:14.5,e:45},
  {q:0.15,h:13.5,e:55},{q:0.2,h:12.0,e:58},{q:0.25,h:10.0,e:56},
  {q:0.3,h:8.0,e:42},{q:0.4,h:5.0,e:30}
];

function agregarFila(q='',h='',e='') {
  const cont = document.getElementById('tabla-bomba');
  const div = document.createElement('div');
  div.className = 'table-row';
  div.innerHTML = `
    <input type="number" value="${q}" step="0.01" placeholder="0.00">
    <input type="number" value="${h}" step="0.1" placeholder="0.0">
    <input type="number" value="${e}" step="1" placeholder="0">
    <button class="btn-remove" onclick="this.parentElement.remove()" aria-label="Eliminar">
      <i class="ti ti-x" aria-hidden="true"></i>
    </button>`;
  cont.appendChild(div);
}

datosIniciales.forEach(d => agregarFila(d.q, d.h, d.e));

function obtenerDatos() {
  const filas = document.querySelectorAll('#tabla-bomba .table-row');
  const puntos = [];
  filas.forEach(f => {
    const inputs = f.querySelectorAll('input');
    const q = parseFloat(inputs[0].value), h = parseFloat(inputs[1].value), e = parseFloat(inputs[2].value);
    if (!isNaN(q) && !isNaN(h)) puntos.push({q, h, e: isNaN(e) ? 0 : e});
  });
  return puntos.sort((a,b) => a.q - b.q);
}

function interpolar(pts, q) {
  if (q <= pts[0].q) return pts[0].h;
  if (q >= pts[pts.length-1].q) return pts[pts.length-1].h;
  for (let i = 0; i < pts.length-1; i++) {
    if (q >= pts[i].q && q <= pts[i+1].q) {
      const t = (q-pts[i].q)/(pts[i+1].q-pts[i].q);
      return pts[i].h + t*(pts[i+1].h-pts[i].h);
    }
  }
}

function interpolarEta(pts, q) {
  if (q <= pts[0].q) return pts[0].e;
  if (q >= pts[pts.length-1].q) return pts[pts.length-1].e;
  for (let i = 0; i < pts.length-1; i++) {
    if (q >= pts[i].q && q <= pts[i+1].q) {
      const t = (q-pts[i].q)/(pts[i+1].q-pts[i].q);
      return pts[i].e + t*(pts[i+1].e-pts[i].e);
    }
  }
}

function findIntersection(pts, hg, perdida, qReq) {
  const qMax = pts[pts.length-1].q * 1.2;
  let bestQ = 0, bestDiff = Infinity;
  for (let i = 0; i <= 2000; i++) {
    const q = (i/2000)*qMax;
    const diff = Math.abs(interpolar(pts,q) - (hg + perdida*Math.pow(q/qReq,2)));
    if (diff < bestDiff) { bestDiff = diff; bestQ = q; }
  }
  return bestQ;
}

function dibujarCroquis(hg, perdida, qOp, hOp) {
  const W = 700, H = 280;
  const escala = Math.min(160 / Math.max(hg, 1), 18);
  const alturaPx = Math.min(hg * escala, 160);
  const tW = 70, tH = 55;
  const tiX = 50, tiY = 220;
  const tsX = 500, tsY = tiY - alturaPx;
  const bX = 240, bY = tiY - 10;
  const stroke = Math.min(Math.max(qOp * 700, 2), 7).toFixed(1);
  const hTotal = (hg + perdida).toFixed(2);

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;font-family:'JetBrains Mono',monospace;">
  <defs>
    <marker id="ma" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3z" fill="#388bfd"/></marker>
    <marker id="mg" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3z" fill="#3fb950"/></marker>
  </defs>

  <!-- suelo -->
  <line x1="20" y1="${tiY+10}" x2="${W-20}" y2="${tiY+10}" stroke="#6e7681" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- TANQUE INFERIOR -->
  <rect x="${tiX}" y="${tiY-tH}" width="${tW}" height="${tH}" fill="rgba(56,139,253,0.06)" stroke="#388bfd" stroke-width="1.5" rx="3"/>
  <rect x="${tiX+4}" y="${tiY-tH+10}" width="${tW-8}" height="14" fill="rgba(56,139,253,0.2)" rx="2"/>
  <text x="${tiX+tW/2}" y="${tiY+18}" text-anchor="middle" fill="#6e7681" font-size="9">Tanque inf.</text>
  <text x="${tiX+tW/2}" y="${tiY-tH/2+5}" text-anchor="middle" fill="#388bfd" font-size="11">≈</text>

  <!-- TANQUE SUPERIOR -->
  <rect x="${tsX}" y="${tsY-tH}" width="${tW}" height="${tH}" fill="rgba(63,185,80,0.06)" stroke="#3fb950" stroke-width="1.5" rx="3"/>
  <rect x="${tsX+4}" y="${tsY-tH+10}" width="${tW-8}" height="14" fill="rgba(63,185,80,0.2)" rx="2"/>
  <text x="${tsX+tW/2}" y="${tsY+18}" text-anchor="middle" fill="#6e7681" font-size="9">Tanque sup.</text>
  <text x="${tsX+tW/2}" y="${tsY-tH/2+5}" text-anchor="middle" fill="#3fb950" font-size="11">≈</text>

  <!-- BOMBA -->
  <circle cx="${bX}" cy="${bY-22}" r="22" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
  <polygon points="${bX-9},${bY-22} ${bX+5},${bY-32} ${bX+5},${bY-12}" fill="#388bfd"/>
  <text x="${bX}" y="${bY+8}" text-anchor="middle" fill="#6e7681" font-size="9">Bomba</text>

  <!-- TUBERÍA SUCCIÓN -->
  <line x1="${tiX+tW}" y1="${tiY-20}" x2="${bX-22}" y2="${bY-22}"
    stroke="#388bfd" stroke-width="${stroke}" stroke-linecap="round" marker-end="url(#ma)"/>

  <!-- TUBERÍA IMPULSIÓN -->
  <polyline points="${bX+22},${bY-22} ${bX+22},${tsY-20} ${tsX},${tsY-20}"
    fill="none" stroke="#3fb950" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mg)"/>

  <!-- COTA Hg -->
  <line x1="${tsX+tW+14}" y1="${tiY-20}" x2="${tsX+tW+14}" y2="${tsY-20}" stroke="#d29922" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="${tsX+tW+8}" y1="${tiY-20}" x2="${tsX+tW+20}" y2="${tiY-20}" stroke="#d29922" stroke-width="1.5"/>
  <line x1="${tsX+tW+8}" y1="${tsY-20}" x2="${tsX+tW+20}" y2="${tsY-20}" stroke="#d29922" stroke-width="1.5"/>
  <text x="${tsX+tW+26}" y="${(tiY+tsY)/2-16}" fill="#d29922" font-size="9" dominant-baseline="middle">Hg=${hg.toFixed(1)}m</text>

  <!-- COTAS PÉRDIDAS label -->
  <text x="${bX+30}" y="${bY-55}" fill="#f85149" font-size="9">ΔH=${perdida.toFixed(1)}m</text>

  <!-- INFO BOXES -->
  <rect x="10" y="6" width="140" height="38" rx="5" fill="rgba(22,27,34,0.95)" stroke="rgba(99,110,123,0.25)" stroke-width="1"/>
  <text x="80" y="19" text-anchor="middle" fill="#6e7681" font-size="8">Caudal operativo</text>
  <text x="80" y="36" text-anchor="middle" fill="#388bfd" font-size="14" font-weight="700">Q=${qOp.toFixed(3)} m³/s</text>

  <rect x="${W/2-110}" y="6" width="220" height="38" rx="5" fill="rgba(22,27,34,0.95)" stroke="rgba(99,110,123,0.25)" stroke-width="1"/>
  <text x="${W/2}" y="19" text-anchor="middle" fill="#6e7681" font-size="8">Altura manométrica total</text>
  <text x="${W/2}" y="36" text-anchor="middle" fill="#d29922" font-size="14" font-weight="700">H=${hTotal} m</text>

</svg>`;
}

let chartH = null, chartE = null;

function calcular() {
  const puntos = obtenerDatos();
  if (puntos.length < 3) { alert('Ingresá al menos 3 puntos.'); return; }

  const hg = parseFloat(document.getElementById('hg').value);
  const perdida = parseFloat(document.getElementById('perdida').value);
  const qReq = parseFloat(document.getElementById('q_req').value);
  const rpmRef = parseFloat(document.getElementById('rpm_ref').value);
  if ([hg,perdida,qReq,rpmRef].some(isNaN)) { alert('Completá todos los campos.'); return; }

  const qOp = findIntersection(puntos, hg, perdida, qReq);
  const hOp = interpolar(puntos, qOp);
  const etaOp = interpolarEta(puntos, qOp);
  const hInsOp = hg + perdida * Math.pow(qOp/qReq, 2);
  const hReq = hg + perdida;
  const hBombaEnQReq = interpolar(puntos, qReq);
  const rpmNecesaria = rpmRef * Math.sqrt(hReq / hBombaEnQReq);
  const gamma = 9810;
  const potencia = (gamma * qOp * hOp) / (etaOp/100 || 1);
  const potenciaKW = potencia / 1000;
  const etaMax = Math.max(...puntos.map(p => p.e));
  const puntoEtaMax = puntos.find(p => p.e === etaMax);
  const qRange = puntos.map(p => p.q);
  const hBombaRange = puntos.map(p => p.h);
  const hInstRange = qRange.map(q => parseFloat((hg + perdida*Math.pow(q/qReq,2)).toFixed(2)));
  const etaRange = puntos.map(p => p.e);

  // Actualizar croquis
  document.getElementById('croquis-wrap').innerHTML = dibujarCroquis(hg, perdida, qOp, hOp);

  // Actualizar panel inferior
  const pb = document.getElementById('panel-bottom');
  pb.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card accent">
        <div class="kpi-label"><i class="ti ti-droplet"></i> Caudal operativo</div>
        <div class="kpi-value">${qOp.toFixed(3)}<span class="kpi-unit"> m³/s</span></div>
        <div class="kpi-sub">${(qOp*3600).toFixed(1)} m³/h</div>
      </div>
      <div class="kpi-card accent">
        <div class="kpi-label"><i class="ti ti-arrow-up"></i> Altura operativa</div>
        <div class="kpi-value">${hOp.toFixed(2)}<span class="kpi-unit"> m</span></div>
        <div class="kpi-sub">H inst: ${hInsOp.toFixed(2)} m</div>
      </div>
      <div class="kpi-card green">
        <div class="kpi-label"><i class="ti ti-percentage"></i> Rendimiento</div>
        <div class="kpi-value">${etaOp.toFixed(1)}<span class="kpi-unit"> %</span></div>
        <div class="kpi-sub">η máx: ${etaMax.toFixed(1)}%</div>
      </div>
      <div class="kpi-card yellow">
        <div class="kpi-label"><i class="ti ti-bolt"></i> Potencia</div>
        <div class="kpi-value">${potenciaKW.toFixed(2)}<span class="kpi-unit"> kW</span></div>
        <div class="kpi-sub">${potencia.toFixed(0)} W</div>
      </div>
    </div>

    <div class="charts-row">
      <div class="chart-box">
        <div class="chart-title"><i class="ti ti-chart-line"></i> Curvas Q-H</div>
        <canvas id="chartH"></canvas>
      </div>
      <div class="chart-box">
        <div class="chart-title"><i class="ti ti-chart-area"></i> Rendimiento η vs Q</div>
        <canvas id="chartE"></canvas>
      </div>
    </div>

    <div class="result-row">
      <div class="result-card">
        <div class="result-title"><i class="ti ti-settings"></i> Leyes de semejanza</div>
        <table class="result-table">
          <tr><td>RPM catálogo</td><td>${rpmRef.toFixed(0)} rpm</td></tr>
          <tr><td>H requerida</td><td>${hReq.toFixed(2)} m</td></tr>
          <tr><td>H bomba a Q diseño</td><td>${hBombaEnQReq.toFixed(2)} m</td></tr>
          <tr><td>Q diseño</td><td>${qReq.toFixed(3)} m³/s</td></tr>
        </table>
        <div class="rpm-highlight">RPM estimadas para punto de diseño<strong>${rpmNecesaria.toFixed(0)} RPM</strong></div>
      </div>
      <div class="result-card">
        <div class="result-title"><i class="ti ti-info-circle"></i> Punto óptimo</div>
        <table class="result-table">
          <tr><td>η máximo</td><td>${etaMax.toFixed(1)} %</td></tr>
          <tr><td>Q en η máx</td><td>${puntoEtaMax ? puntoEtaMax.q.toFixed(3) : 'N/A'} m³/s</td></tr>
          <tr><td>η en punto operativo</td><td>${etaOp.toFixed(1)} %</td></tr>
          <tr><td>Potencia hidráulica</td><td>${(gamma*qOp*hOp/1000).toFixed(2)} kW</td></tr>
        </table>
      </div>
    </div>
  `;

  if (chartH) chartH.destroy();
  if (chartE) chartE.destroy();

  const opts = {
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: { labels: { color:'#8b949e', font:{family:'JetBrains Mono,monospace',size:10} } },
      tooltip: { backgroundColor:'#161b22', borderColor:'#30363d', borderWidth:1, titleColor:'#e6edf3', bodyColor:'#8b949e' }
    }
  };

  chartH = new Chart(document.getElementById('chartH').getContext('2d'), {
    type:'line',
    data: { datasets: [
      { label:'Bomba H(Q)', data:qRange.map((q,i)=>({x:q,y:hBombaRange[i]})), borderColor:'#388bfd', tension:.4, fill:false, pointRadius:3, pointBackgroundColor:'#388bfd', borderWidth:2 },
      { label:'Instalación H(Q)', data:qRange.map((q,i)=>({x:q,y:hInstRange[i]})), borderColor:'#3fb950', tension:.4, fill:false, pointRadius:3, borderWidth:2, borderDash:[5,4] },
      { label:'Punto operativo', data:[{x:parseFloat(qOp.toFixed(4)),y:parseFloat(hOp.toFixed(2))}], borderColor:'#d29922', backgroundColor:'#d29922', pointRadius:9, showLine:false }
    ]},
    options: { ...opts, scales: {
      x:{type:'linear',title:{display:true,text:'Q (m³/s)',color:'#8b949e'},ticks:{color:'#6e7681'},grid:{color:'rgba(99,110,123,.12)'}},
      y:{title:{display:true,text:'H (m)',color:'#8b949e'},ticks:{color:'#6e7681'},grid:{color:'rgba(99,110,123,.12)'}}
    }}
  });

  chartE = new Chart(document.getElementById('chartE').getContext('2d'), {
    type:'line',
    data: { datasets: [
      { label:'η (%)', data:qRange.map((q,i)=>({x:q,y:etaRange[i]})), borderColor:'#d29922', backgroundColor:'rgba(210,153,34,.08)', tension:.4, fill:true, pointRadius:3, pointBackgroundColor:'#d29922', borderWidth:2 }
    ]},
    options: { ...opts, scales: {
      x:{type:'linear',title:{display:true,text:'Q (m³/s)',color:'#8b949e'},ticks:{color:'#6e7681'},grid:{color:'rgba(99,110,123,.12)'}},
      y:{title:{display:true,text:'η (%)',color:'#8b949e'},min:0,max:100,ticks:{color:'#6e7681'},grid:{color:'rgba(99,110,123,.12)'}}
    }}
  });
}
</script>
</body>
</html>
